{% extends 'base.html' %}

{% block title %}Volunteer - {{ settings.name }}{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Become a Volunteer</h1>
</section>

<section class="container form-section">
    <div class="form-container">
        <h2>Join Our Team</h2>
        <p>We are always looking for passionate individuals to help us make a difference.</p>
        
        <form method="POST" action="{% url 'volunteer' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="interests">Why do you want to volunteer? What are your interests?</label>
                <textarea id="interests" name="interests" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Register as Volunteer</button>
        </form>
    </div>
</section>
{% endblock %}
