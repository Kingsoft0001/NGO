{% extends 'base.html' %}

{% block title %}Donate - {{ settings.name }}{% endblock %}

{% block content %}
<section class="page-header">
    <h1>Make a Donation</h1>
</section>

<section class="container form-section">
    <div class="form-container">
        <h2>Support Our Cause</h2>
        <p>Your contribution helps us continue our mission. Thank you for your generosity.</p>
        
        <form method="POST" action="{% url 'donate' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="donor_name">Full Name</label>
                <input type="text" id="donor_name" name="donor_name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Donation Amount ($)</label>
                <input type="number" id="amount" name="amount" min="1" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="campaign_id">Direct to a Specific Campaign (Optional)</label>
                <select id="campaign_id" name="campaign_id">
                    <option value="">General Fund</option>
                    {% for campaign in campaigns %}
                    <option value="{{ campaign.id }}" {% if request.GET.campaign == campaign.id|stringformat:"s" %}selected{% endif %}>{{ campaign.title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Message (Optional)</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Donate Now</button>
        </form>
    </div>
</section>
{% endblock %}
